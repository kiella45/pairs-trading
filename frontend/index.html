<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pairs Trading Screener</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0e1a;
            color: #c9d1d9;
            min-height: 100vh;
        }
        .header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: 1.3rem;
            color: #58a6ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .filters {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filters select, .filters input, .filters button {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .filters button {
            background: #238636;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .filters button:hover { background: #2ea043; }
        .filters button:disabled { opacity: 0.5; cursor: not-allowed; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            padding: 16px 24px;
            background: #0d1117;
        }
        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-card .label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; }
        .stat-card .value { font-size: 1.4rem; font-weight: 700; margin-top: 4px; }
        .stat-card.green .value { color: #3fb950; }
        .stat-card.red .value { color: #f85149; }
        .stat-card.blue .value { color: #58a6ff; }

        .table-container {
            padding: 0 24px 24px;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        thead {
            background: #161b22;
            position: sticky;
            top: 0;
        }
        th {
            padding: 12px;
            text-align: left;
            color: #8b949e;
            border-bottom: 2px solid #30363d;
            cursor: pointer;
            user-select: none;
        }
        th:hover { color: #58a6ff; }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #21262d;
        }
        tr:hover { background: #161b22; }
        tr { cursor: pointer; transition: background 0.15s; }

        .signal-long { color: #3fb950; font-weight: 700; }
        .signal-short { color: #f85149; font-weight: 700; }
        .signal-hold { color: #d29922; }
        .signal-close { color: #8b949e; }

        .score-high { color: #3fb950; font-weight: 700; }
        .score-mid { color: #d29922; font-weight: 700; }
        .score-low { color: #f85149; font-weight: 700; }

        .z-bar {
            width: 100%;
            height: 4px;
            background: #21262d;
            border-radius: 2px;
            position: relative;
            margin-top: 4px;
        }
        .z-indicator {
            position: absolute;
            top: -3px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: translateX(-50%);
        }
        .z-indicator.green { background: #3fb950; }
        .z-indicator.red { background: #f85149; }
        .z-indicator.gray { background: #8b949e; }

        .loading {
            text-align: center;
            padding: 60px;
            color: #8b949e;
        }
        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 { color: #58a6ff; }
        .modal-close {
            background: none;
            border: none;
            color: #8b949e;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .modal-close:hover { color: #f85149; }
        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 20px;
        }
        .pair-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .info-item {
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }
        .info-item .label { font-size: 0.7rem; color: #8b949e; }
        .info-item .value { font-size: 1rem; font-weight: 600; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 Pairs Trading Screener</h1>
        <div class="filters">
            <select id="timeframe">
                <option value="1h">1H</option>
                <option value="4h">4H</option>
                <option value="15m">15M</option>
            </select>
            <input type="number" id="minCorr" value="0.5" min="-1" max="1" step="0.1" title="Min Correlation">
            <input type="number" id="maxHL" value="30" min="1" title="Max Half-life (days)">
            <input type="number" id="topN" value="50" min="1" max="200" title="Top N">
            <button id="loadBtn" onclick="loadPairs(false)">📂 Load (Cache)</button>
            <button id="forceBtn" onclick="loadPairs(true)" style="background:#f85149;">🔄 Force Refresh</button>
        </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="table-container">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading pairs from Binance...</p>
        </div>
        <table id="pairsTable" style="display:none;">
            <thead>
                <tr>
                    <th onclick="sortBy('score')">Score ↕</th>
                    <th onclick="sortBy('pair')">Pair ↕</th>
                    <th onclick="sortBy('signal')">Signal ↕</th>
                    <th onclick="sortBy('z_score')">Z-Score ↕</th>
                    <th onclick="sortBy('correlation_6m')">Corr 6M ↕</th>
                    <th onclick="sortBy('cointegration_pvalue')">Coint p-val ↕</th>
                    <th onclick="sortBy('adf_pvalue')">ADF p-val ↕</th>
                    <th onclick="sortBy('half_life_days')">HL (days) ↕</th>
                    <th onclick="sortBy('spread_deviation_pct')">Spread Dev % ↕</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Pair Detail</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="pair-info" id="pairInfo"></div>
            <div class="chart-container">
                <canvas id="zScoreChart"></canvas>
            </div>
            <div class="chart-container">
                <canvas id="spreadChart"></canvas>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
